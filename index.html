<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * {
            cursor: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #000000;
            font-family: monospace;
            font-size: 3rem;
            letter-spacing: 15px;
            user-select: none;
            z-index: 10;
            position: fixed;
            top: 40vh;
            mix-blend-mode: difference;
            pointer-events: none;
        }
        .gallery-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            padding-top: 20px;
        }
        img {
            max-width: 400px;
            width: 80%;
            height: auto;
            filter: grayscale(100%) contrast(150%);
            mix-blend-mode: luminosity;
            pointer-events: none;
            opacity: 0.8;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <h1>Always Watching</h1>

    <div class="gallery-container" id="gallery"></div>

    <script>
        // 1. Prints a random set of 1000 digits to the console log
        let digits = '';
        for (let i = 0; i < 1000; i++) {
            digits += Math.floor(Math.random() * 10);
        }
        console.log(digits);

        // 2. Direct hardcoded file array to bypass GitHub API block
        const USERNAME = 'actincide17';
        const REPO = 'WatchingForever';
        const FOLDER_PATH = 'Gallery';

        // Explicitly listing the PNG filenames present in your repository folder
        const images = [
            '2026-08-01_17.43.38.png',
            '2026-08-01_17.44.33.png'
        ];

        // Alphabetically auto-sorts the files
        const sortedImages = images.sort((a, b) => a.localeCompare(b));
        const container = document.getElementById('gallery');
        let imageIndex = 0;

        function appendImage(filename) {
            const imgElement = document.createElement('img');
            imgElement.src = `https://githubusercontent.com{actincide17}/${REPO}/main/${FOLDER_PATH}/${filename}`; 
            container.appendChild(imgElement);
        }

        // Initial render list
        sortedImages.forEach(filename => appendImage(filename));

        // Note: Infinite scrolling requires more than 2 items to trigger layout extensions.
        // If you add more files to the array layout above, this scroll listener automatically engages.
        if (sortedImages.length > 2) {
            window.addEventListener('scroll', () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    appendImage(sortedImages[imageIndex]);
                    imageIndex = (imageIndex + 1) % sortedImages.length;
                }
            });
        }
    </script>

</body>
</html>
