<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            padding-top: 100%; 
            overflow: hidden;
            border-radius: 8px;
            background-color: #1e1e1e;
        }

        .gallery-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="Gallery-container" id="Gallery">
        <!-- Images will load here automatically -->
    </div>

    <script>
        const folder = "Gallery/";
        const galleryContainer = document.getElementById('Gallery');

        async function loadImages() {
            try {
                // Fetch the folder directory page generated by GitHub Pages
                const response = await fetch(folder);
                const text = await response.text();
                
                // Create a temporary element to parse the folder's HTML links
                const parser = new DOMParser();
                const htmlDoc = parser.parseFromString(text, 'text/html');
                const links = htmlDoc.querySelectorAll('a');

                links.forEach(link => {
                    const href = link.getAttribute('href');
                    
                    // Look strictly for files ending in .png
                    if (href && href.toLowerCase().endsWith('.png')) {
                        // Ensure the path is correct whether it's absolute or relative
                        const imgSrc = href.includes(folder) ? href : folder + href;

                        const item = document.createElement('div');
                        item.className = 'gallery-item';

                        const img = document.createElement('img');
                        img.src = imgSrc;
                        img.alt = "Gallery Image";

                        item.appendChild(img);
                        galleryContainer.appendChild(item);
                    }
                });
            } catch (error) {
                console.error("Could not auto-load images:", error);
            }
        }

        loadImages();
    </script>

</body>
</html>
