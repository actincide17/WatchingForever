<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #121212;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            grid-gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            width: 100%;
            padding-top: 100%; 
            overflow: hidden;
            border-radius: 8px;
            background-color: #1e1e1e;
        }

        .gallery-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="gallery-container" id="gallery">
        <!-- Images will load here automatically without file names -->
    </div>

    <script>
        const galleryContainer = document.getElementById('gallery');
        const folderName = "Gallery"; // Matches your capitalized folder name

        async function loadGallery() {
            try {
                // Automatically extracts username and repo name from your GitHub Pages URL
                // Example: username.github.io/repo-name/
                const hostname = window.location.hostname;
                const pathParts = window.location.pathname.split('/').filter(part => part.length > 0);
                
                const username = hostname.split('.')[0];
                const repo = pathParts[0];

                // Request the folder contents directly from GitHub's Public API
                const apiUrl = `https://github.com{username}/${repo}/contents/${folderName}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to read the Gallery folder via API');
                
                const files = await response.json();

                files.forEach(file => {
                    // Check strictly for .png files (case-insensitive)
                    if (file.name.toLowerCase().endsWith('.png')) {
                        const item = document.createElement('div');
                        item.className = 'gallery-item';

                        const img = document.createElement('img');
                        img.src = file.download_url; // Direct raw URL to the image file
                        img.alt = "Gallery Image";

                        item.appendChild(img);
                        galleryContainer.appendChild(item);
                    }
                });
            } catch (error) {
                console.error("Error dynamically loading images:", error);
            }
        }

        loadGallery();
    </script>

</body>
</html>
