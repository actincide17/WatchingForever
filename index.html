<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #111;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        img {
            max-width: 300px;
            max-height: 300px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <script>
        // 1. Manually add your image filenames to this list
        const images = [
            'image1.jpg',
            'image2.png',
            'photo3.webp'
        ];

        // 2. This loop automatically grabs each image and shows it
        images.forEach(filename => {
            const imgElement = document.createElement('img');
            imgElement.src = `gallery/${filename}`; 
            document.body.appendChild(imgElement);
        });
    </script>

</body>
</html>
