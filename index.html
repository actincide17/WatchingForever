<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * {
            cursor: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #000000;
            font-family: monospace;
            font-size: 3rem;
            letter-spacing: 15px;
            user-select: none;
            z-index: 10;
            position: fixed;
            top: 40vh;
            mix-blend-mode: difference;
            pointer-events: none;
        }
        .gallery-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0px;
            padding-top: 20px;
        }
        img {
            max-width: 400px;
            width: 80%;
            height: auto;
            filter: grayscale(100%) contrast(150%);
            mix-blend-mode: luminosity;
            pointer-events: none;
            opacity: 0.8;
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <h1>Always Watching</h1>

    <div class="gallery-container" id="gallery"></div>

    <script>
        // 1000 random digits in console
        let digits = '';
        for (let i = 0; i < 1000; i++) {
            digits += Math.floor(Math.random() * 10);
        }
        console.log(digits);

        // Your image array
        const images = [
            'image1.jpg',
            'image2.png',
            'photo3.webp'
        ];

        // Alphabetically auto-sort the file names
        images.sort((a, b) => a.localeCompare(b));

        const container = document.getElementById('gallery');

        // Function to create and append an image element
        function appendImage(filename) {
            const imgElement = document.createElement('img');
            imgElement.src = `gallery/${filename}`; 
            container.appendChild(imgElement);
        }

        // Initial render: list the sorted images
        images.forEach(filename => appendImage(filename));

        // Infinite loop generator if there are more than 2 images
        if (images.length > 2) {
            let imageIndex = 0;

            window.addEventListener('scroll', () => {
                // Check if user is scrolling near the bottom of the page
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    // Loop back to the start of the sorted list continuously
                    appendImage(images[imageIndex]);
                    imageIndex = (imageIndex + 1) % images.length;
                }
            });
        }
    </script>

</body>
</html>
