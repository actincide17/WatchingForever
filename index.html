<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        * {
            cursor: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h1 {
            color: #000000;
            font-family: monospace;
            font-size: 3rem;
            letter-spacing: 15px;
            user-select: none;
            z-index: 10;
            position: fixed;
            mix-blend-mode: difference;
        }
        .gallery-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        img {
            position: absolute;
            max-width: 250px;
            max-height: 250px;
            filter: grayscale(100%) contrast(150%);
            mix-blend-mode: luminosity;
            pointer-events: none;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <h1>Always Watching</h1>

    <div class="gallery-container"></div>

    <script>
        // 1000 random digits in console
        let digits = '';
        for (let i = 0; i < 1000; i++) {
            digits += Math.floor(Math.random() * 10);
        }
        console.log(digits);

        // Your image array
        const images = [
            'image1.jpg',
            'image2.png',
            'photo3.webp'
        ];

        const container = document.querySelector('.gallery-container');

        // Scatters images completely at random positions across the blank screen
        images.forEach(filename => {
            const imgElement = document.createElement('img');
            imgElement.src = `gallery/${filename}`; 
            
            const randomX = Math.floor(Math.random() * 70) + 5;
            const randomY = Math.floor(Math.random() * 70) + 5;
            const randomRotation = Math.floor(Math.random() * 360);

            imgElement.style.left = `${randomX}%`;
            imgElement.style.top = `${randomY}%`;
            imgElement.style.transform = `rotate(${randomRotation}deg)`;

            container.appendChild(imgElement);
        });
    </script>

</body>
</html>
